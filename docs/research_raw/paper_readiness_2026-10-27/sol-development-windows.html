<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;color:var(--foreground);font-family:var(--font-sans)}
h3{font-weight:500;margin:0 0 18px}
.row{display:grid;grid-template-columns:62px minmax(100px,1fr) 76px;gap:12px;align-items:center;margin:18px 0}
.track{height:16px;background:var(--muted)}
.mark{height:16px;background:var(--chart-1)}
.number{font-variant-numeric:tabular-nums;text-align:right}
p{margin:18px 0 0;color:var(--muted-foreground)}
</style>
</head>
<body>
<figure style="margin:0" aria-labelledby="sol-dev-title" aria-describedby="sol-dev-note">
<h3 id="sol-dev-title">Development at first management access</h3>
<div class="row"><span>Sol</span><div class="track" role="img" aria-label="16 of 17 trade-completed groups developed"><div class="mark" style="width:94.12%"></div></div><span class="number">16 / 17</span></div>
<div class="row"><span>Gemini</span><div class="track" role="img" aria-label="17 of 18 trade-completed groups developed"><div class="mark" style="width:94.44%"></div></div><span class="number">17 / 18</span></div>
<div class="row"><span>Opus</span><div class="track" role="img" aria-label="7 of 15 trade-completed groups developed"><div class="mark" style="width:46.67%"></div></div><span class="number">7 / 15</span></div>
<div class="row"><span>Grok</span><div class="track" role="img" aria-label="3 of 13 trade-completed groups developed"><div class="mark" style="width:23.08%"></div></div><span class="number">3 / 13</span></div>
<p id="sol-dev-note">Exploratory reconstruction of 63 trade-completed color groups across 20 games. First management access is conditional on earlier jail and financing choices. Groups share game outcomes. This is not a skill ranking.</p>
</figure>
</body>
</html>
