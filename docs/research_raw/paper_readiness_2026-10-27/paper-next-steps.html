<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MonopolyBench paper development</title>
<style>
body { margin: 0; font-family: var(--font-sans); color: var(--foreground); }
#paper-path { width: 100%; }
.step { padding: 16px; border-radius: var(--radius); background: var(--secondary); color: var(--secondary-foreground); text-align: center; }
.arrow { color: var(--muted-foreground); text-align: center; padding: 5px 0; }
.parallel { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.parallel .step { background: color-mix(in srgb, var(--chart-1) 14%, var(--secondary)); }
.label { margin: 0 0 8px; text-align: center; color: var(--muted-foreground); }
.detail { display: block; margin-top: 6px; color: var(--muted-foreground); }
@media (max-width: 400px) { .parallel { gap: 8px; } }
</style>
</head>
<body>
<div id="paper-path" role="img" aria-label="Agree on claims and scope. Validate evidence and figures while writing the complete manuscript. All four researchers review the entire paper. Revise the paper and regenerate its artifacts. Package the release and submit.">
<div class="step">Agree on claims and scope</div>
<div class="arrow" aria-hidden="true">↓</div>
<div class="label">Proceed together</div>
<div class="parallel">
<div class="step">Validate evidence<br>and build figures</div>
<div class="step">Write the<br>complete manuscript</div>
</div>
<div class="arrow" aria-hidden="true">↓</div>
<div class="step">Four independent reviews of the whole paper<span class="detail">Astra · Sol · Opus · Fable</span></div>
<div class="arrow" aria-hidden="true">↓</div>
<div class="step">Resolve objections, revise, and regenerate</div>
<div class="arrow" aria-hidden="true">↓</div>
<div class="step">Verify the release and submission package</div>
</div>
</body>
</html>
