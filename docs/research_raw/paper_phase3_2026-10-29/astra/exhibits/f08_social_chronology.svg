   <g id="text_1">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="12.501" y="20.43" transform="rotate(-0 12.501 20.43)">A · Selective framing, with an earlier buyer motive</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle" x="108.9792" y="44.244" transform="rotate(-0 108.9792 44.244)">G13 d251 · buyer</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(35.666263 54.858)">Counters at $130; already values</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(33.889763 68.058)">solvency for Short Line rent to p2.</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #4d667b" x="108.9792" y="94.518" transform="rotate(-0 108.9792 94.518)">Returned provider summary</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle" x="321.0192" y="44.244" transform="rotate(-0 321.0192 44.244)">G13 d252 · seller</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(253.317637 55.126125)">Declines $130; omits available</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(253.166387 68.058)">Ventnor mortgage in the pitch.</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #4d667b" x="321.0192" y="94.518" transform="rotate(-0 321.0192 94.518)">Applied note + returned explanation</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle" x="533.0592" y="44.244" transform="rotate(-0 533.0592 44.244)">G13 d253 · buyer</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(462.090638 54.858)">Prompt contains d252 message.</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(466.903138 68.058)">Accepts the $200 transaction.</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #4d667b" x="533.0592" y="94.518" transform="rotate(-0 533.0592 94.518)">Delivered prompt + applied action</text>
   </g>
   <g id="text_11">
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; text-anchor: start" x="12.501" y="120.978" transform="rotate(-0 12.501 120.978)">Legal alternative: $35 + $130 counteroffer + $130 mortgage = $295. No $70 persuasion effect identified.</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="12.501" y="168.606" transform="rotate(-0 12.501 168.606)">B · Correcting a premise while accepting the terms</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle" x="108.9792" y="192.42" transform="rotate(-0 108.9792 192.42)">G19 d135 · proposer</text>
   </g>
   <g id="text_14">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(40.74895 203.8865)">Sends an offer with a mistaken</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(63.541638 216.234)">color-group premise.</text>
   </g>
   <g id="text_15">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #4d667b" x="108.9792" y="242.694" transform="rotate(-0 108.9792 242.694)">Applied public offer</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle" x="321.0192" y="192.42" transform="rotate(-0 321.0192 192.42)">G19 d135 · same call</text>
   </g>
   <g id="text_17">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(251.068825 203.034)">Private argument says to abort;</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(249.29645 216.234)">the received proposal is applied.</text>
   </g>
   <g id="text_18">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #4d667b" x="321.0192" y="242.694" transform="rotate(-0 321.0192 242.694)">Within-call inconsistency</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle" x="533.0592" y="192.42" transform="rotate(-0 533.0592 192.42)">G19 d136 · recipient</text>
   </g>
   <g id="text_20">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(466.408138 203.034)">Explicitly corrects the premise</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(470.05945 216.234)">and accepts the transaction.</text>
   </g>
   <g id="text_21">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #4d667b" x="533.0592" y="242.694" transform="rotate(-0 533.0592 242.694)">Recipient note + applied action</text>
   </g>
   <g id="text_22">
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; text-anchor: start" x="12.501" y="269.154" transform="rotate(-0 12.501 269.154)">Settlement does not establish uptake of the false premise or a channel-consistent proposer record.</text>
   </g>
   <g id="text_23">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="12.501" y="316.782" transform="rotate(-0 12.501 316.782)">C · A transient echo followed by correction and rejection</text>
   </g>
   <g id="text_24">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle" x="108.9792" y="340.596" transform="rotate(-0 108.9792 340.596)">G11 d255 · proposer</text>
   </g>
   <g id="text_25">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(50.565075 351.21)">Claims the proposed trade</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(44.6677 364.41)">would complete both groups.</text>
   </g>
   <g id="text_26">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #4d667b" x="108.9792" y="390.87" transform="rotate(-0 108.9792 390.87)">Applied public proposal</text>
   </g>
   <g id="text_27">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle" x="321.0192" y="340.596" transform="rotate(-0 321.0192 340.596)">G11 d256 · recipient</text>
   </g>
   <g id="text_28">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(263.833637 352.0625)">Returned text first echoes</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(232.5737 364.41)">completion, then checks and corrects it.</text>
   </g>
   <g id="text_29">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #4d667b" x="321.0192" y="390.87" transform="rotate(-0 321.0192 390.87)">Within-response sequence</text>
   </g>
   <g id="text_30">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle" x="533.0592" y="340.596" transform="rotate(-0 533.0592 340.596)">G11 d256 · action</text>
   </g>
   <g id="text_31">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(464.470075 351.21)">Rejects; the final public/private</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(473.683263 364.41)">record rejects the premise.</text>
   </g>
   <g id="text_32">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #4d667b" x="533.0592" y="390.87" transform="rotate(-0 533.0592 390.87)">Applied action and arguments</text>
   </g>
   <g id="text_33">
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; text-anchor: start" x="12.501" y="417.33" transform="rotate(-0 12.501 417.33)">Transient textual uptake is observed; durable belief, successful persuasion and general immunity are not identified.</text>
   </g>
   <g id="text_34">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle" x="325.26" y="454.374" transform="rotate(-0 325.26 454.374)">Selected case contrasts, not population rates. Public bluffing is authorized by this cohort's instructions.</text>
   </g>
  </g>
