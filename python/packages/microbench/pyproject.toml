[project]
name = "monopoly-microbench"
version = "0.1.0"
description = "Micro-decision benchmark suite for MonopolyBench"
readme = "README.md"
authors = [
    { name = "Kushagra Bharti", email = "kushagrabharti@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.25.1",
    "monopoly-arena",
    "monopoly-engine",
    "monopoly-telemetry",
    "pydantic>=2.12.5",
    "rich>=14.2.0",
]

[project.scripts]
monopoly-micro = "monopoly_microbench.cli:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
monopoly-arena = { workspace = true, editable = true }
monopoly-engine = { workspace = true, editable = true }
monopoly-telemetry = { workspace = true, editable = true }

[dependency-groups]
lint = [
    "ruff>=0.14.10",
]
test = [
    "pytest>=9.0.2",
]
type = [
    "mypy>=1.19.1",
]
